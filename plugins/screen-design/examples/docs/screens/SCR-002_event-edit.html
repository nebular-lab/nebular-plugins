<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SCR-002 イベント編集</title>
  <link rel="stylesheet" href="wireframe.css">
</head>
<body>

  <section class="screen" data-title="通常（公開済みを編集）">
    <header class="row between" data-no="1">
      <span class="icon">≡</span>
      <strong>イベント管理</strong>
      <span class="icon">人</span>
    </header>

    <a data-no="2">← 一覧へ戻る</a>

    <div class="row between">
      <h1 data-no="3">イベントを編集</h1>
      <span class="box" data-no="4">公開中</span>
    </div>

    <p data-no="5"><small>主催: 山田 花子（イベント推進グループ）</small></p>

    <label class="field" data-no="6">
      タイトル（必須）
      <input type="text" value="はじめての TypeScript ハンズオン" placeholder="例: はじめての TypeScript ハンズオン">
    </label>

    <label class="field" data-no="7">
      概要
      <textarea placeholder="イベントの内容を 200 文字以内で入力"></textarea>
    </label>

    <label class="field" data-no="8">
      カテゴリ（必須）
      <select><option>勉強会</option><option>交流会</option><option>社内研修</option></select>
    </label>

    <div class="stack" data-no="9">
      開催形式（必須）
      <div class="row">
        <label class="check"><input type="radio" name="format">会場</label>
        <label class="check"><input type="radio" name="format" checked>オンライン</label>
      </div>
    </div>

    <label class="field" data-no="11">
      配信 URL（必須）
      <input type="url" value="https://meet.example.com/ts-handson" placeholder="https://">
    </label>

    <div class="cols-2">
      <label class="field" data-no="12">
        開催日（必須）
        <input type="date" value="2026-10-12" disabled>
      </label>
      <label class="field" data-no="13">
        定員（必須）
        <input type="number" value="30">
      </label>
    </div>

    <div class="stack" data-no="14">
      タグ（3 つまで）
      <div class="cols-2">
        <label class="check"><input type="checkbox" checked>初心者向け</label>
        <label class="check"><input type="checkbox" checked>ハンズオン</label>
        <label class="check"><input type="checkbox">交流</label>
        <label class="check"><input type="checkbox">無料</label>
        <label class="check"><input type="checkbox">英語</label>
      </div>
    </div>

    <label class="check" data-no="15"><input type="checkbox">変更を参加者にメールで通知する</label>

    <div class="spacer"></div>

    <button class="primary" data-no="17">更新する</button>
    <button data-no="18">削除</button>
  </section>

  <section class="screen" data-title="新規作成（会場を選択）">
    <header class="row between">
      <span class="icon">≡</span>
      <strong>イベント管理</strong>
      <span class="icon">人</span>
    </header>
    <a>← 一覧へ戻る</a>
    <h1>イベントを作成</h1>
    <label class="field">タイトル（必須）<input type="text" placeholder="例: はじめての TypeScript ハンズオン"></label>
    <label class="field">概要<textarea placeholder="イベントの内容を 200 文字以内で入力"></textarea></label>
    <label class="field">カテゴリ（必須）<select><option>選択してください</option></select></label>
    <div class="stack">
      開催形式（必須）
      <div class="row">
        <label class="check"><input type="radio" name="format2" checked>会場</label>
        <label class="check"><input type="radio" name="format2">オンライン</label>
      </div>
    </div>
    <label class="field" data-no="10">会場名（必須）<input type="text" placeholder="例: 渋谷オフィス 5F セミナールーム"></label>
    <div class="cols-2">
      <label class="field">開催日（必須）<input type="date"></label>
      <label class="field">定員（必須）<input type="number" placeholder="1〜999"></label>
    </div>
    <div class="note">タグ（通常と同じ）</div>
    <div class="spacer"></div>
    <div class="cols-2">
      <button data-no="16">下書き保存</button>
      <button class="primary">公開する</button>
    </div>
  </section>

  <section class="screen" data-title="入力エラー">
    <header class="row between">
      <span class="icon">≡</span>
      <strong>イベント管理</strong>
      <span class="icon">人</span>
    </header>
    <a>← 一覧へ戻る</a>
    <h1>イベントを作成</h1>
    <label class="field">タイトル（必須）<input type="text" value="A"><small class="error">タイトルは 2 文字以上で入力してください</small></label>
    <label class="field">カテゴリ（必須）<select><option>選択してください</option></select><small class="error">カテゴリを選択してください</small></label>
    <label class="field">定員（必須）<input type="number" value="0"><small class="error">定員は 1〜999 で入力してください</small></label>
    <div class="note">エラーは各項目の下に表示する。他の項目は省略</div>
  </section>

  <section class="screen" data-title="削除の確認">
    <header class="row between">
      <span class="icon">≡</span>
      <strong>イベント管理</strong>
      <span class="icon">人</span>
    </header>
    <h1>イベントを編集</h1>
    <div class="modal">
      <div class="dialog" data-no="19">
        <h2>イベントを削除しますか？</h2>
        <p>「はじめての TypeScript ハンズオン」を削除します。この操作は取り消せません。</p>
        <div class="cols-2">
          <button data-no="20">キャンセル</button>
          <button class="primary" data-no="21">削除する</button>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
