<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SCR-005 ログイン</title>
  <link rel="stylesheet" href="../wireframe.css">
</head>
<body>

  <section class="screen" data-title="通常">
    <header class="row between">
      <strong>イベント管理</strong>
    </header>

    <h1 data-no="1">ログイン</h1>

    <p class="error" data-no="2">メールアドレスまたはパスワードが正しくありません</p>

    <div class="field"><label data-no="3">メールアドレス（必須）</label><div data-no="4"><input type="email" placeholder="例: taro@example.com"></div><small class="error" data-no="5">メールアドレスを入力してください</small></div>

    <div class="field"><label data-no="6">パスワード（必須）</label><div data-no="7"><input type="password"></div><small class="error" data-no="8">パスワードを入力してください</small></div>

    <div class="row">
      <button class="primary" data-no="9">ログイン</button>
    </div>
  </section>

</body>
</html>
