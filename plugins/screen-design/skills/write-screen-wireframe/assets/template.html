<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SCR-NNN 画面名</title>
  <link rel="stylesheet" href="wireframe.css">
</head>
<body>

  <!-- 状態ごとに .screen を並べる。data-title は状態名 -->
  <section class="screen" data-title="通常">
    <header class="row between" data-no="1">
      <span class="icon">≡</span>
      <strong>サービス名</strong>
      <span class="icon">人</span>
    </header>

    <h1 data-no="2">画面タイトル</h1>

    <label class="field" data-no="3">
      項目名
      <input type="text" placeholder="入力例">
    </label>

    <div class="spacer"></div>

    <button class="primary" data-no="4">送信</button>
  </section>

</body>
</html>
